name: Update feed

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button
  push:
    paths: ["apps.toml", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build apps.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_feed.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- apps.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "Update feed"
          git push
